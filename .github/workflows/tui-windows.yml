name: TUI portability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Windows line editor dependency
        if: runner.os == 'Windows'
        run: python -m pip install windows-curses==2.4.2
      - name: Prepare hash-verified public source fixture
        run: python test/prepare-playback-fixture.py
      - name: Apply the Windows TUI port
        run: git apply --directory=fixture patches/tui-windows.patch
      - name: Prove complete TUI history and main-loop startup
        env:
          MM_REQUIRE_WINDOWS_TUI_TEST: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python test/tui-startup.py --bundle fixture
